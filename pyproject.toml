[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinator-workflow"
dynamic = ["version"]
description = "Local run control for file-backed, frontier-led coding workflows"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Crute" }]
dependencies = [
  "Authlib==1.7.2",
  "httpx==0.28.1",
  "joserfc==1.7.4",
  "mcp==2.0.0",
  "starlette==1.4.0",
  "uvicorn==0.52.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "coverage==7.15.4",
  "httpx2==2.9.1",
  "pip-audit==2.10.1",
  "playwright==1.62.0",
]

[tool.coverage.run]
branch = true
source = ["coordinator"]

[tool.coverage.report]
fail_under = 80.0
precision = 1
show_missing = true

[project.scripts]
coordinator = "coordinator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "coordinator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coordinator = [
  "assets/web/*",
  "assets/web/vendor/*",
  "assets/project-template/*.md",
  "assets/project-template/.coordination/*.md",
  "assets/project-template/.coordination/coder/*.md",
  "assets/project-template/.coordination/history/.gitkeep",
  "assets/project-template/.coordination/planner/*.md",
  "assets/project-template/.coordination/reviews/*.md",
  "assets/project-template/.coordination/runtime/.gitignore",
  "assets/project-template/.coordination/scripts/*.py",
]
