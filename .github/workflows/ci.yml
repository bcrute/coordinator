name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install locked application and test dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Audit application dependencies
        run: uv run python -m pip_audit --requirement requirements.txt

      - name: Byte-compile skills and tests
        run: uv run python -m compileall -q src skills tests

      - name: Run unit test suite with branch coverage
        run: |
          uv run coverage erase
          uv run coverage run -m unittest discover -s tests -v
          mv .coverage .coverage.union.full

      - name: Trace executor subprocess contracts
        run: |
          COVERAGE_FILE=.coverage.executor uv run coverage run --rcfile=.coveragerc-subprocess -m unittest -v tests.test_executor_adapters
          COVERAGE_FILE=.coverage.executor uv run coverage combine --rcfile=.coveragerc-subprocess
          cp .coverage.executor .coverage.union.executor

      - name: Report branch coverage and enforce the regression floor
        run: |
          COVERAGE_FILE=.coverage.union uv run coverage combine --keep
          COVERAGE_FILE=.coverage.union uv run coverage report

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax-check vendored dashboard app
        run: node --check src/coordinator/assets/web/app.js

  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install locked application and test dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Run browser workflow
        env:
          COORDINATOR_E2E: "1"
        run: uv run python -m unittest -v tests.test_web_e2e
