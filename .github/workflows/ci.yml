name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked application and test dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Audit application dependencies
        run: uv run python -m pip_audit --requirement requirements.txt

      - name: Byte-compile skills and tests
        run: uv run python -m compileall -q src skills tests

      - name: Run unit test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax-check vendored dashboard app
        run: node --check src/coordinator/assets/web/app.js

  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install locked application and test dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Run browser workflow
        env:
          COORDINATOR_E2E: "1"
        run: uv run python -m unittest -v tests.test_web_e2e
