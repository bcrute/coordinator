name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Verify tag matches application version
        run: |
          version="$(uv run python -c 'import coordinator; print(coordinator.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Test and build distributions
        run: |
          uv run python -m unittest discover -s tests -q
          uv run python -m compileall -q src skills tests
          uv run python -m build

      - name: Generate dependency SBOM and checksums
        run: |
          uv run python -m pip_audit --requirement requirements.txt --format cyclonedx-json --output dist/coordinator-sbom.cdx.json
          cd dist
          sha256sum *.whl *.tar.gz coordinator-sbom.cdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest dependency SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/coordinator-sbom.cdx.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: coordinator-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/coordinator-sbom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish immutable tag release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz \
            dist/coordinator-sbom.cdx.json dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Coordinator ${GITHUB_REF_NAME}"
