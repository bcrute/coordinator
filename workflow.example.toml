# Example settings file for skills/coordinate-claude-work/scripts/web_app.py.
#
# Copy this file (for example to workflow.toml, which stays untracked) and
# adjust the values, then run:
#
#   .venv/bin/coordinator serve --config workflow.toml
#
# Every key here is optional; anything you omit falls back to the program's
# built-in default. Command-line flags such as --port always override the
# matching value from this file.
#
# Relative "repo" and "repositories_root" paths below are resolved against
# the directory that contains *this configuration file*, not whatever
# directory you happen to launch the command from.

# The project root to serve. "." means "the same directory as this file".
repo = "."

# The directory whose Git direct children can be switched to from the app.
# ".." means "the parent of this file's directory".
repositories_root = ".."

# Bind address. The loopback default keeps the unauthenticated app off the LAN.
host = "127.0.0.1"

# TCP port; 0 picks a free port.
port = 8765

# Number of relay-log lines returned by /api/state.
relay_log_lines = 200

# Codex and Claude usage is refreshed without creating model turns. The server
# keeps one shared snapshot, so extra browser tabs do not multiply provider calls.
usage_refresh_seconds = 3600

# Implementation executor. "claude" preserves the original Claude Code workflow.
# To use a local or API-backed model through mini-swe-agent, install its `mini`
# command separately and uncomment the settings below.
# executor_adapter = "mini-swe-agent"
# Keep executor_adapter = "claude" and enable this to let Claude supervise bounded
# 8-10 routing-score tasks performed by the configured mini-swe backend through MCP.
# claude_local_delegation = true
# mini_swe_command = "mini"
# mini_swe_model = "your-local-model"
# "bounded" is the normal Coordinator packet executor. Use "exploratory" only
# for genuinely open-ended repository investigation.
# mini_swe_profile = "bounded"
# mini_swe_api_base = "http://127.0.0.1:8000/v1"
# mini_swe_provider = "openai"
# Leave blank for a local endpoint with no authentication, or name an inherited key.
# mini_swe_api_key_env = ""
# mini_swe_step_limit = 12
# mini_swe_cost_limit = 0.0
# mini_swe_timeout_seconds = 900
# Optional base mini-swe-agent YAML; relative paths resolve against this file.
# mini_swe_config = "mini-local.yaml"

# Suppress Uvicorn lifecycle messages. Request access logs stay disabled.
quiet = false

# Authentication mode. Both modes use the same ASGI runtime; "local" enforces
# a loopback bind and "oidc" enables the authentication boundary.
# Change this to "oidc" only after completing the settings below and placing
# the app behind a TLS reverse proxy.
auth_mode = "local"

# Authenticated OIDC settings (uncomment for auth_mode = "oidc"). The client
# secret itself never belongs in this file; only its environment-variable name
# is configured here.
# oidc_issuer = "https://auth.example.com/application/o/coordinator/"
# oidc_client_id = "replace-with-the-authentik-client-id"
# oidc_client_secret_env = "COORDINATOR_OIDC_CLIENT_SECRET"
# external_url = "https://coordinator.example.com"

# Default-deny authorization. Configure at least one exact subject or group.
# Prefer a dedicated Authentik group for routine administration.
# allowed_subjects = []
# allowed_groups = ["coordinator-users"]
# groups_claim = "groups"

# Opaque sessions and redacted audit records are stored in SQLite here. Use an
# absolute path outside the clone for a service deployment.
# state_dir = "/var/lib/coordinator"
# session_idle_seconds = 3600
# session_absolute_seconds = 43200

# Sliding-window abuse controls. Authentication starts, state-changing API
# controls, and terminal socket attachments use separate per-source/session
# budgets within this window.
# rate_limit_window_seconds = 60
# rate_limit_auth_attempts = 30
# rate_limit_control_attempts = 120
# rate_limit_terminal_connections = 30

# The terminal is enabled by default in loopback-local mode and disabled by
# default in OIDC mode. Enabling it grants an authorized browser interactive
# command execution as the Coordinator service identity.
# terminal_enabled = false

# The external hostname accepted by the application and the proxy addresses
# whose X-Forwarded-For/X-Forwarded-Proto values Uvicorn may trust.
# trusted_hosts = ["coordinator.example.com"]
# forwarded_allow_ips = "127.0.0.1"

# Development escape hatch only. Never enable this for a network deployment;
# production OIDC requires HTTPS and a Secure cookie.
# insecure_oidc_http = false
